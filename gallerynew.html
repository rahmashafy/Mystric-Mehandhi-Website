<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gallery | Mystric Mehandhi</title>
  <link rel="stylesheet" href="site.css">
</head>
<body>
  <header class="site-header">
    <div class="nav-shell">
      <a class="brand" href="index.html"><strong>Mystric Mehandhi</strong><span>Natural henna artistry</span></a>
      <nav aria-label="Main navigation">
        <ul class="nav-links">
          <li><a href="index.html">Home</a></li>
          <li><a href="service2.html">Services</a></li>
          <li><a href="shop.html">Shop</a></li>
          <li><a href="gallerynew.html" aria-current="page">Gallery</a></li>
          <li><a href="about.html">About</a></li>
          <li><a href="contactl.html">Contact</a></li>
          <li><a href="faqsnew.html">FAQs</a></li>
        </ul>
      </nav>
      <div class="nav-actions">
        <button class="icon-button" type="button" data-open-cart>Cart<span class="cart-badge" data-cart-count>0</span></button>
      </div>
    </div>
  </header>

  <main>
    <section class="page-hero">
      <div class="container">
        <p class="eyebrow">Design inspiration</p>
        <h1>Photo Gallery</h1>
        <p>Filter by design style and choose references before booking your appointment.</p>
      </div>
    </section>

    <section class="section">
      <div class="container">
        <div class="gallery-tools">
          <button class="button-secondary" type="button" data-gallery-filter="all">All</button>
          <button class="button-secondary" type="button" data-gallery-filter="gulf">Gulf</button>
          <button class="button-secondary" type="button" data-gallery-filter="arabic">Arabic</button>
          <button class="button-secondary" type="button" data-gallery-filter="simple">Simple</button>
          <button class="button-secondary" type="button" data-gallery-filter="bridal">Bridal</button>
        </div>

        <div class="grid grid-4">
          <figure class="gallery-item" data-gallery-item="gulf"><img src="gulf.jpg" alt="Gulf mehndi design"><figcaption>Gulf Design</figcaption></figure>
          <figure class="gallery-item" data-gallery-item="arabic"><img src="arabic.jpg" alt="Arabic mehndi design"><figcaption>Arabic Design</figcaption></figure>
          <figure class="gallery-item" data-gallery-item="arabic"><img src="arabic1.jpg" alt="Arabic floral design"><figcaption>Arabic Floral</figcaption></figure>
          <figure class="gallery-item" data-gallery-item="bridal"><img src="bridal.jpg" alt="Bridal mehndi design"><figcaption>Bridal Detail</figcaption></figure>
          <figure class="gallery-item" data-gallery-item="gulf"><img src="gulf1.jpg" alt="Gulf hand design"><figcaption>Gulf Hand</figcaption></figure>
          <figure class="gallery-item" data-gallery-item="arabic"><img src="arabic2.jpg" alt="Arabic hand design"><figcaption>Arabic Trail</figcaption></figure>
          <figure class="gallery-item" data-gallery-item="simple"><img src="simple3.jpg" alt="Simple mehndi design"><figcaption>Simple Leaves</figcaption></figure>
          <figure class="gallery-item" data-gallery-item="bridal"><img src="bridal1.jpg" alt="Bridal full hand design"><figcaption>Bridal Full Hand</figcaption></figure>
          <figure class="gallery-item" data-gallery-item="gulf"><img src="gulf2.jpg" alt="Gulf pattern"><figcaption>Gulf Pattern</figcaption></figure>
          <figure class="gallery-item" data-gallery-item="simple"><img src="simple5.jpg" alt="Simple floral pattern"><figcaption>Simple Floral</figcaption></figure>
          <figure class="gallery-item" data-gallery-item="arabic"><img src="arabic4.jpg" alt="Arabic finger pattern"><figcaption>Arabic Fingers</figcaption></figure>
          <figure class="gallery-item" data-gallery-item="simple"><img src="simple6.jpg" alt="Minimal mehndi design"><figcaption>Minimal Style</figcaption></figure>
        </div>

        <div class="hero-actions">
          <a class="button-secondary" href="book.html">Book From Gallery</a>
        </div>
      </div>
    </section>
  </main>

  <footer class="site-footer">
    <div class="container">
      <div class="footer-bottom">&copy; 2026 Mystric Mehandhi. All rights reserved.</div>
    </div>
  </footer>

  <script src="site.js"></script>
</body>
</html>
