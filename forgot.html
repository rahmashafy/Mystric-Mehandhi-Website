<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Forgot Password | Mystric Mehandhi</title>
  <link rel="stylesheet" href="site.css">
</head>
<body class="auth-page">
  <main class="auth-card form-shell">
    <a class="brand" href="index.html">
      <strong>Mystric Mehandhi</strong>
      <span>Back to website</span>
    </a>
    <h1>Forgot Password</h1>
    <p>Enter your email to generate a demo reset step.</p>
    <form id="forgotForm" class="form-grid">
      <div class="field full">
        <label for="email">Email</label>
        <input type="email" id="email" name="email" placeholder="name@example.com" required>
      </div>
      <button class="button-secondary" type="submit">Generate Reset</button>
    </form>
    <div class="status-message" id="authStatus" role="status"></div>
    <p><a href="reset.html">Continue to reset password</a></p>
  </main>
  <script src="site.js"></script>
</body>
</html>
